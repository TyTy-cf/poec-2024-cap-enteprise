name: Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: db_moment-jeux-test
          MARIADB_USER: app
          MARIADB_PASSWORD: app
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20'

      - name: Setup Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/db_moment-jeux-test
          SPRING_DATASOURCE_USERNAME: app
          SPRING_DATASOURCE_PASSWORD: app
          MAVEN_OPTS: "-Xmx2G -Dwebdriver.chrome.verboseLogging=true -Dwebdriver.chrome.logfile=/tmp/chromedriver.log"
        run: |
          mvn clean test -e -X -Dsurefire.rerunFailingTestsCount=0 || true

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip allure-2.27.0.zip
          echo "$GITHUB_WORKSPACE/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: |
          sudo apt-get install -y default-jdk
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip allure-2.27.0.zip
          export PATH=$PWD/allure-2.27.0/bin:$PATH
          mkdir -p allure-report
          allure generate target/allure-results/ -o allure-report --clean

      - name: Upload Allure Report HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report/





